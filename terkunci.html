<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VEINMARA Generation</title>
  <meta name="description" content="VEINMARA Generation — Angkatan Kelas Akhir 2026–2027 Pesantren Modern Daarul 'Uluum Lido. Segera hadir.">
  <meta name="theme-color" content="#1c0509">
  <link rel="icon" type="image/png" href="assets/web/logo-veinmara.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("anim");
  </script>
</head>
<body>
  <!-- Ditampilkan menggantikan semua halaman selama web dikunci (lihat Control Panel → Acara & Countdown) -->
  <main>
    <section class="hero hero--kunci">
      <svg class="veins veins--tl" viewBox="0 0 600 400" aria-hidden="true"></svg>
      <svg class="veins veins--br" viewBox="0 0 600 400" aria-hidden="true"></svg>
      <div class="sparkles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>

      <div class="hero__inner">
        <p class="eyebrow" data-intro>Kelas Akhir 2026 – 2027 · Pesantren Modern Daarul ‘Uluum Lido</p>
        <div class="hero__logo" data-intro>
          <img src="assets/web/logo-veinmara.png" alt="Logo angkatan VEINMARA Generation" width="1000" height="1000" fetchpriority="high">
        </div>
        <h1 class="hero__title">
          <span class="hero__name" data-intro>Veinmara</span>
          <span class="hero__gen" data-intro>Generation</span>
        </h1>
        <p class="hero__motto" data-intro>A Renewal Catalyst</p>

        <div class="countdown" id="countdown" data-intro hidden>
          <p class="countdown__label">Menuju Peresmian Angkatan</p>
          <div class="countdown__grid" role="timer" aria-live="off">
            <div><b id="cd-d">00</b><span>Hari</span></div>
            <div><b id="cd-h">00</b><span>Jam</span></div>
            <div><b id="cd-m">00</b><span>Menit</span></div>
            <div><b id="cd-s">00</b><span>Detik</span></div>
          </div>
        </div>
        <p class="kunci__when" id="cd-when" data-intro></p>
        <p class="hero__done" id="cd-done" hidden>Segera hadir</p>
      </div>
    </section>
  </main>

  <script src="vendor/anime-4.5.0.umd.min.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/terkunci.js"></script>
</body>
</html>
